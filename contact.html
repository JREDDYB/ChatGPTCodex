<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Contacts</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 6rem 1rem 2rem; color: #f6f4ff; background: #10131f; background-image: radial-gradient(ellipse at 18% 15%, #5935a844, transparent 38%), radial-gradient(ellipse at 85% 82%, #087eaa33, transparent 40%); }
    .glow { position: fixed; width: 26rem; height: 26rem; border-radius: 50%; filter: blur(90px); opacity: .17; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; background: #9b72ff; top: -12rem; right: -7rem; }
    .site-nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; transform: translateX(-50%); display: flex; gap: .35rem; padding: .4rem; border: 1px solid #ffffff1c; border-radius: 999px; background: #111522bb; backdrop-filter: blur(14px); white-space: nowrap; }
    .site-nav a { padding: .65rem 1rem; border-radius: 999px; color: #b5b6c8; text-decoration: none; font-size: .84rem; transition: color .2s, background .2s; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: #fff; background: #ffffff12; }
    .card { width: min(90vw, 720px); padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem); text-align: center; position: relative; border: 1px solid #ffffff20; border-radius: 30px; background: linear-gradient(145deg, #ffffff0d, #ffffff04); box-shadow: 0 30px 100px #0005, inset 0 1px #ffffff12; backdrop-filter: blur(18px); animation: appear .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; color: #c7b4ff; font-size: .76rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 14px #a78bfa; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(3rem, 9vw, 5.5rem); line-height: .98; letter-spacing: -.07em; font-weight: 800; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #c4a8ff 5%, #8bdfff 95%); background-clip: text; -webkit-background-clip: text; }
    p { margin: 0 auto; max-width: 490px; color: #b5b6c8; font-size: clamp(1rem, 2.5vw, 1.12rem); line-height: 1.75; }
    .footer { margin-top: 2.5rem; color: #777b91; font-size: .75rem; letter-spacing: .06em; }
    .contact-note { margin-top: 1.5rem; padding: 1rem 1.2rem; border: 1px solid #ffffff14; border-radius: 16px; color: #c7c8d6; background: #ffffff08; font-size: .95rem; line-height: 1.6; }
    a:focus-visible { outline: 3px solid #a78bfa; outline-offset: 4px; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(-10rem, 12rem) scale(1.2); } }
    @media (max-width: 480px) { .site-nav { top: .75rem; } .site-nav a { padding: .58rem .72rem; font-size: .78rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style></head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">Get to know me</a>
    <a href="contact.html" aria-current="page">Contacts</a>
  </nav>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span> Let’s connect</div>
    <h1>Say<span>hello.</span></h1>
    <p>Have a question, an idea, or just want to say hi? I’d love to hear from you.</p>
    <div class="contact-note">Add your preferred email address or social links here so people know the best way to reach you.</div>
    <div class="footer">I’M LOOKING FORWARD TO HEARING FROM YOU</div>
  </main>
</body>
</html>
