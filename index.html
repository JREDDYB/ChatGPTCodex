<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>Hello, JRB!  Hope you are doing fantastic!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      color: #f6f4ff; background: #10131f;
      background-image: radial-gradient(ellipse at 18% 15%, #5935a844, transparent 38%), radial-gradient(ellipse at 85% 82%, #087eaa33, transparent 40%);
    }
    .glow { position: fixed; width: 26rem; height: 26rem; border-radius: 50%; filter: blur(90px); opacity: .17; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; background: #9b72ff; top: -12rem; right: -7rem; }
    .card { width: min(90vw, 720px); padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem); text-align: center; position: relative; border: 1px solid #ffffff20; border-radius: 30px; background: linear-gradient(145deg, #ffffff0d, #ffffff04); box-shadow: 0 30px 100px #0005, inset 0 1px #ffffff12; backdrop-filter: blur(18px); animation: appear .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; color: #c7b4ff; font-size: .76rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 14px #a78bfa; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(3.5rem, 11vw, 6.5rem); line-height: .95; letter-spacing: -.075em; font-weight: 800; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #c4a8ff 5%, #8bdfff 95%); background-clip: text; -webkit-background-clip: text; }
    p { margin: 0 auto; max-width: 420px; color: #b5b6c8; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.7; }
    button { margin-top: 2.3rem; padding: .95rem 1.35rem; border: 1px solid #ffffff25; border-radius: 999px; color: #f7f4ff; background: #ffffff0d; font: inherit; font-size: .92rem; font-weight: 650; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
    button:hover { transform: translateY(-2px); background: #ffffff18; border-color: #ffffff55; }
    button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 4px; }
    .sparkle { display: inline-block; margin-left: .35rem; transition: transform .35s; }
    button:hover .sparkle { transform: rotate(25deg) scale(1.2); }
    .footer { margin-top: 2.8rem; color: #777b91; font-size: .75rem; letter-spacing: .06em; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(-10rem, 12rem) scale(1.2); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span> A little something on the web</div>
    <h1>Hello,<span>World!</span></h1>
    <p>A simple beginning, dressed up with a little color, a little motion, and plenty of possibility.</p>
    <button type="button" id="helloButton">Say hello <span class="sparkle" aria-hidden="true">✦</span></button>
    <div class="footer">MADE FOR THE MOMENT</div>
  </main>
  <script>
    const button = document.querySelector('#helloButton');
    button.addEventListener('click', () => {
      const saidHello = button.dataset.greeted === 'true';
      button.dataset.greeted = String(!saidHello);
      button.innerHTML = saidHello
        ? 'Say hello <span class="sparkle" aria-hidden="true">✦</span>'
        : 'Hello, you! <span class="sparkle" aria-hidden="true">✦</span>';
    });
  </script>
</body>
</html>
